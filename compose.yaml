name: medimate

services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: medimate-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medimate}
      POSTGRES_DB: ${POSTGRES_DB:-medimate}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medimate} -d ${POSTGRES_DB:-medimate}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.4
    container_name: medimate-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medimate-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-medimate}:${POSTGRES_PASSWORD:-medimate}@db:5432/${POSTGRES_DB:-medimate}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_AUTH_REQUIRED: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
    volumes:
      - .:/app # hot reload
      - node_modules:/app/node_modules # keep container deps out of the bind mount
      - next_cache:/app/.next # keep container build artifacts 
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Regenerate the client against the bind-mounted schema (needs no
    # DATABASE_URL), apply migrations, then start. migrate deploy is
    # non-interactive and idempotent — safe at container start.
    command: sh -c "pnpm dev"

  # End-to-end tests. Only starts with: docker compose --profile test run --rm playwright
  playwright:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/playwright/Dockerfile
    container_name: medimate-playwright
    # Shares the app's network so the browser reaches it on localhost:3000,
    # which matches BETTER_AUTH_URL and keeps auth cookies valid.
    network_mode: "service:app"
    shm_size: 1gb
    env_file:
      - .env
    environment:
      CI: "true"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medimate}:${POSTGRES_PASSWORD:-medimate}@db:5432/${POSTGRES_DB:-medimate}
    volumes:
      - ./tests:/app/tests
      - ./playwright.config.ts:/app/playwright.config.ts
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
    depends_on:
      app:
        condition: service_started

volumes:
  pgdata:
  node_modules:
  next_cache:

